<div class="wrapper wrapper-wide" id="header">
    <a id="site-title" rel="author" href="{{- "/" | relative_url -}}">
        {{- site.title -}}
    </a>

    <nav id="site-nav">
        {%- for page1 in site.pages -%}
            {%- if page1.in-header and page1.site == page.site and page1.title  -%}
                <a class="page-link" href="{{- page1.url -}}">{{- page1.title -}}</a>
            {%- endif -%}
        {%- endfor -%}
    </nav>
</div>
